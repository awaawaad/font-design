<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字体设计 · 线构成研究</title>
<style>.ppt-sq{display:flex;flex-direction:column;align-items:center;justify-content:center;width:82px;height:82px;margin:16px auto 0;border-radius:16px;gap:3px;background:rgba(22,22,40,.62);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;text-decoration:none;transition:background .28s,border-color .28s,transform .28s,box-shadow .28s;}.ppt-sq:hover{background:rgba(232,93,4,.24);border-color:rgba(232,93,4,.7);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35);}.ppt-sq:active{transform:translateY(0) scale(.97);}.ppt-sq .t{font-size:13px;font-weight:700;letter-spacing:.10em;line-height:1;}.ppt-sq .s{font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.55);line-height:1;}.ppt-sq .a{font-size:11px;color:#E85D04;line-height:1;}.ppt-sq.off{background:rgba(22,22,40,.34);border:1px dashed rgba(255,255,255,.20);cursor:default;}.ppt-sq.off:hover{transform:none;box-shadow:none;background:rgba(22,22,40,.34);border-color:rgba(255,255,255,.20);}.ppt-sq.off .t{color:rgba(255,255,255,.55);}@media (max-width:560px){.ppt-sq{width:64px;height:64px;margin-top:10px;border-radius:13px;}.ppt-sq .t{font-size:11px;}.ppt-sq .s{display:none;}}</style>
<style>
  :root{
    --bg:#FFFFFF;--panel:#FAFAFA;--line:#E2E2E2;--line-hi:#C8C8C8;
    --text:#1A1A1A;--dim:#8A8A8A;--faint:#E0E0E0;--accent:#E85D04;
    --side:210px;
    --ph:url("img/d953362a31.jpg");
    --sans:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{background:#1A1A2E;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;
    background-image:url("img/6ded683a64.jpg");
    background-size:auto 122%;background-position:left center;background-attachment:fixed;
    z-index:0;pointer-events:none;}
  .w-radio,.g-radio{position:absolute;opacity:0;pointer-events:none;}
  .wrap{position:relative;z-index:1;max-width:1800px;margin:0 auto;padding:0 24px 80px;}

  header{padding:72px 0 46px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--accent);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--accent);}
  h1{font-size:clamp(26px,4.2vw,52px);line-height:1.15;font-weight:600;margin-bottom:14px;}
  h1 em{font-style:normal;color:var(--accent);}
  .meta{display:flex;flex-wrap:wrap;gap:32px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.1em;color:var(--dim);}
  .meta dt{font-family:var(--mono);margin-bottom:4px;opacity:.6;font-size:10px;}
  .meta dd{color:var(--text);font-size:14px;}

  .work-tabs{
    display:flex;flex-wrap:wrap;gap:9px;
    padding:22px 0;margin-bottom:34px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20;
  }
  .work-tabs label{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    padding:9px 17px;border:1px solid var(--line-hi);color:var(--dim);
    cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap;
  }
  .work-tabs label:hover{color:var(--text);border-color:#555;}

  .works{}
  .work{display:none;}

  .stage-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .stage-head h2{font-size:clamp(17px,2vw,22px);font-weight:600;letter-spacing:.03em;}
  .stage-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);margin-left:auto;}

  .layout{display:flex;gap:22px;align-items:flex-start;}

  .side{
    width:var(--side);flex-shrink:0;
    border:1px solid var(--line);background:var(--panel);
    position:sticky;top:76px;
  }
  .side-item{
    display:flex;align-items:center;gap:10px;
    padding:15px 16px;cursor:pointer;
    border-left:2px solid transparent;
    border-bottom:1px solid var(--line);
    transition:all .2s;
  }
  .side-item:last-child{border-bottom:none;}
  .side-item:hover{background:#F7F7F7;}
  .side-idx{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#B0B0B0;flex-shrink:0;}
  .side-name{font-size:14px;font-weight:600;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-cnt{font-family:var(--mono);font-size:9px;color:#777777;margin-left:auto;flex-shrink:0;}

  .stage{flex:1;min-width:0;}
  .group-panel{display:none;}

  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:100%;margin:0;}

  figure{
    position:relative;aspect-ratio:16/9;
    border:1px solid var(--line);background:var(--panel);
    overflow:hidden;transition:border-color .28s,box-shadow .28s,transform .28s;
  }
  figure::before{content:attr(data-idx);position:absolute;top:7px;left:9px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);
    z-index:4;transition:color .28s;pointer-events:none;}
  figure::after{content:"+";position:absolute;bottom:5px;right:9px;
    font-family:var(--mono);font-size:11px;color:var(--faint);
    z-index:4;transition:color .28s;pointer-events:none;}
  .ph{position:absolute;inset:0;background-image:var(--ph);background-repeat:no-repeat;background-position:center 38%;background-size:34%;opacity:.72;mix-blend-mode:multiply;
    display:flex;align-items:flex-end;justify-content:flex-start;
    padding-bottom:3px;font-family:var(--mono);font-size:9px;
    letter-spacing:.12em;color:#AAAAAA;z-index:1;}
  .art{position:absolute;inset:9px;background-repeat:no-repeat;background-position:center;
    background-size:contain;z-index:2;
    mix-blend-mode:multiply;
    transition:transform .32s cubic-bezier(.22,1,.36,1);}
  figure:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(232,93,4,.26),0 0 22px rgba(232,93,4,.12);transform:translateY(-3px);}
  figure:hover .art{transform:scale(1.03);}
  figure:hover::before,figure:hover::after{color:var(--accent);}

  .stub{min-height:420px;border:1px dashed #E5E5E5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px 24px;}
  .stub .icon{display:block;width:150px;height:140px;margin:0 auto;background:var(--ph) center/contain no-repeat;font-size:0;color:transparent;opacity:.75;}
  .stub h3{font-size:22px;font-weight:700;color:#1A1A1A;letter-spacing:.04em;}
  .stub p{font-size:15px;color:#333333;letter-spacing:.08em;font-weight:600;}

  footer{margin-top:80px;padding-top:26px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-size:11px;letter-spacing:.1em;color:#888888;font-family:var(--mono);}

#work-r1:checked ~ .work-tabs label[for="work-r1"]{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  #work-r1:checked ~ .works #work-w1{display:block;}
  #work-r2:checked ~ .work-tabs label[for="work-r2"]{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  #work-r2:checked ~ .works #work-w2{display:block;}
  #work-r3:checked ~ .work-tabs label[for="work-r3"]{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  #work-r3:checked ~ .works #work-w3{display:block;}
  #work-r4:checked ~ .work-tabs label[for="work-r4"]{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  #work-r4:checked ~ .works #work-w4{display:block;}

  ##w1-g0:checked ~ .layout .side label[for="w1-g0"]{background:rgba(232,93,4,.28) !important;border-left:3px solid #E85D04 !important;box-shadow:inset 0 0 0 1px rgba(232,93,4,.4) !important;}
  ##w1-g0:checked ~ .layout .side label[for="w1-g0"] .side-idx,
  ##w1-g0:checked ~ .layout .side label[for="w1-g0"] .side-cnt{color:#FFB066 !important;}
  ##w1-g0:checked ~ .layout .side label[for="w1-g0"] .side-name{color:#FFFFFF !important;}
  #w1-g0:checked ~ .layout .stage #w1-p0{display:block;}
  ##w1-g1:checked ~ .layout .side label[for="w1-g1"]{background:rgba(232,93,4,.28) !important;border-left:3px solid #E85D04 !important;box-shadow:inset 0 0 0 1px rgba(232,93,4,.4) !important;}
  ##w1-g1:checked ~ .layout .side label[for="w1-g1"] .side-idx,
  ##w1-g1:checked ~ .layout .side label[for="w1-g1"] .side-cnt{color:#FFB066 !important;}
  ##w1-g1:checked ~ .layout .side label[for="w1-g1"] .side-name{color:#FFFFFF !important;}
  #w1-g1:checked ~ .layout .stage #w1-p1{display:block;}
  ##w1-g2:checked ~ .layout .side label[for="w1-g2"]{background:rgba(232,93,4,.28) !important;border-left:3px solid #E85D04 !important;box-shadow:inset 0 0 0 1px rgba(232,93,4,.4) !important;}
  ##w1-g2:checked ~ .layout .side label[for="w1-g2"] .side-idx,
  ##w1-g2:checked ~ .layout .side label[for="w1-g2"] .side-cnt{color:#FFB066 !important;}
  ##w1-g2:checked ~ .layout .side label[for="w1-g2"] .side-name{color:#FFFFFF !important;}
  #w1-g2:checked ~ .layout .stage #w1-p2{display:block;}

  @media(max-width:1200px){ .grid{grid-template-columns:repeat(4,1fr);} }
  @media(max-width:960px){
    :root{--side:170px;}
    .wrap{padding:0 20px 80px;}
    .grid{grid-template-columns:repeat(3,1fr);}
    header{padding:52px 0 36px;}
  }
  @media(max-width:700px){
    :root{--side:100px;}
    .side{width:var(--side);}
    .side-item{padding:11px 6px;gap:5px;flex-direction:column;align-items:flex-start;}
    .side-idx{font-size:9px;}
    .side-name{font-size:11px;font-weight:600;line-height:1.3;white-space:normal;}
    .side-cnt{display:none;}
    .grid{grid-template-columns:repeat(2,1fr);max-width:100%;gap:12px;}
    .wrap{padding:0 12px 60px;}
    h1{font-size:24px;}
    .work-tabs label{font-size:10px;padding:8px 10px;letter-spacing:.03em;}
    .stage-tag{display:none;}
  }

  /* ── 圆角 ── */
  figure{border-radius:10px;overflow:hidden;}
  figure .art{border-radius:10px;}
  .slot{border-radius:10px;}
  .side{border-radius:12px;overflow:hidden;}
  .side-item{border-radius:10px;}
  .wtab{border-radius:8px;}
  .work-tabs label{border-radius:8px;}
  .stub,.stub-edit{border-radius:14px;}
  .btn{border-radius:8px;}
  .field input{border-radius:8px;}

  /* ── 层叠修正：内容必须在背景之上 ── */
  .work-tabs,.works,.works .work,.bar{position:relative;z-index:2;}
  .wrap,header,.panel,.layout,.stage{position:relative;z-index:1;}

  /* ── 压在光谱/深色背景上的文字改白 ── */
  .work-title input{color:#FFFFFF !important;text-shadow:0 1px 5px rgba(0,0,0,.55);}
  .work-title input::placeholder{color:rgba(255,255,255,.45) !important;}
  .stage-head h2{color:#FFFFFF !important;text-shadow:0 1px 5px rgba(0,0,0,.55);}
  .stage-head input[type=text]{color:#FFFFFF !important;text-shadow:0 1px 5px rgba(0,0,0,.55);background:transparent !important;}
  .stage-head input[type=text]::placeholder{color:rgba(255,255,255,.45) !important;}
  .stage-head input[type=text]:last-of-type{color:rgba(255,255,255,.62) !important;font-size:11px;}


  .stage-tag{color:rgba(255,255,255,.68) !important;}
  .group-tag{color:rgba(255,255,255,.68) !important;}
  h1{color:#FFFFFF !important;text-shadow:0 2px 8px rgba(0,0,0,.5);}
  header .eyebrow{color:#FF8C42 !important;}
  .meta dt{color:rgba(255,255,255,.5) !important;}
  .meta dd{color:#FFFFFF !important;}
  .note{color:rgba(255,255,255,.55) !important;}
  .note b{color:#FFFFFF !important;}
  .note kbd{background:rgba(255,255,255,.12) !important;border-color:rgba(255,255,255,.2) !important;color:#EDEDED !important;}

  /* ── 右下角提示 ── */
  .toast{
    position:fixed; right:24px; bottom:24px; z-index:9999;
    max-width:340px; padding:14px 18px;
    background:#1A1A2E; color:#fff; border-radius:12px;
    font-size:13px; line-height:1.65; letter-spacing:.02em;
    box-shadow:0 8px 32px rgba(0,0,0,.45);
    opacity:0; transform:translateY(12px); pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast b{color:#FFB066;}

  /* ── Tab 栏：玻璃条（和深色背景同步） ── */
  .work-tabs{
    background:rgba(22,22,40,.72) !important;
    border:1px solid rgba(255,255,255,.13) !important;
    border-radius:14px !important;
    padding:13px 16px !important;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    margin-bottom:26px !important;
  }
  .work-tabs label{
    background:transparent !important;
    border-color:rgba(255,255,255,.22) !important;
    color:rgba(255,255,255,.60) !important;
    border-radius:9px !important;
  }
  .work-tabs label:hover{
    color:#FFFFFF !important;
    border-color:rgba(255,255,255,.5) !important;
    background:rgba(22,22,40,.72) !important;
  }
  #work-r1:checked ~ .work-tabs label[for="work-r1"],
  #work-r2:checked ~ .work-tabs label[for="work-r2"],
  #work-r3:checked ~ .work-tabs label[for="work-r3"],
  #work-r4:checked ~ .work-tabs label[for="work-r4"]{
    background:rgba(10,10,22,.92) !important;
    border-color:rgba(255,255,255,.22) !important;
    color:#FFFFFF !important;
    font-weight:700 !important;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }

  
  /* ── 所有框统一玻璃条 ── */
  .bar{
    background:rgba(22,22,40,.80) !important;
    border-bottom:1px solid rgba(255,255,255,.12) !important;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .bar .brand,.bar label,.bar .hint{color:rgba(255,255,255,.55) !important;}
  .bar input[type=text]{background:rgba(255,255,255,.07) !important;border:1px solid rgba(255,255,255,.16) !important;color:#fff !important;}
  .bar input[type=text]::placeholder{color:rgba(255,255,255,.35) !important;}

  .side{
    background:rgba(22,22,40,.80) !important;
    border:1px solid rgba(255,255,255,.12) !important;
    border-radius:14px !important;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    overflow:hidden;
  }
  .side-item{border-left:2px solid transparent !important;background:transparent !important;}
  .side-item:hover{background:rgba(22,22,40,.72) !important;}
  .side-name{color:rgba(255,255,255,.72) !important;}
  .side-idx{color:rgba(255,255,255,.35) !important;}
  .side-cnt{color:rgba(255,255,255,.4) !important;}
  .side-item.on,.side-item[data-active="1"]{background:rgba(10,10,22,.92) !important;border-left-color:#E85D04 !important;box-shadow:0 2px 10px rgba(0,0,0,.3);}
  .side-item.on .side-name{color:#FFFFFF !important;font-weight:700 !important;}

  .stage-head{border-bottom:1px solid rgba(255,255,255,.12) !important;}

  /* ── 编辑器 tab（.wtab）统一成 玻璃 + 选中实心 ── */
  .wtab{
    background:transparent !important;
    border:1px solid rgba(255,255,255,.22) !important;
    color:rgba(255,255,255,.60) !important;
    border-radius:9px !important;
    transition:all .18s;
  }
  .wtab:hover{
    color:#FFFFFF !important;
    border-color:rgba(255,255,255,.5) !important;
    background:rgba(255,255,255,.07) !important;
  }
  .wtab.on{
    background:rgba(10,10,22,.92) !important;
    border-color:rgba(255,255,255,.24) !important;
    color:#FFFFFF !important;
    font-weight:700 !important;
    box-shadow:0 2px 10px rgba(0,0,0,.38);
  }

  /* ── 图片铺满格子（展览长条样式） ── */
  .art{
    inset:0 !important;
    background-size:cover !important;
    background-position:center !important;
    border-radius:10px !important;
  }
  figure .art{border-radius:10px !important;}
  .slot img{
    object-fit:cover !important;
    padding:0 !important;
    border-radius:10px !important;
  }
  .slot{padding:0 !important;overflow:hidden;}
  figure{padding:0 !important;overflow:hidden;}

  /* ── 展览样式：1 列满宽大图，从上往下排（ARC 官网那种） ── */
  .grid{
    display:flex !important;
    flex-direction:column !important;
    gap:18px !important;
    max-width:100% !important;
    margin:0 !important;
  }
  .grid figure{
    width:100% !important;
    aspect-ratio:16/9 !important;
    border-radius:14px !important;
  }
  .grid .art{
    inset:0 !important;
    background-size:cover !important;
    background-position:center !important;
    border-radius:14px !important;
  }
  .grid figure .id,
  .grid figure .cap{
    z-index:3;
  }
  .grid figure .id{
    font-size:12px !important;
    padding:8px 10px !important;
    text-shadow:0 1px 4px rgba(0,0,0,.8);
  }
  .grid figure .cap{
    font-size:12px !important;
    padding:10px 12px !important;
    color:#fff !important;
    text-shadow:0 1px 6px rgba(0,0,0,.85);
  }

  /* ── 选中态加强：橙色显眼 ── */
  .side-item.on,
  .side-item[data-active="1"]{
    background:rgba(232,93,4,.26) !important;
    border-left:3px solid #E85D04 !important;
    box-shadow:inset 0 0 0 1px rgba(232,93,4,.35) !important;
  }
  .side-item.on .side-name,
  .side-item.on .side-idx,
  .side-item.on .side-cnt{
    color:#FFFFFF !important;
  }
  .side-item.on .side-cnt{color:#FFB066 !important;}

  /* ── 展览大图小一点（限制宽度居中） ── */
  .grid{
    max-width:880px !important;
    margin:0 auto !important;
  }
  .grid figure{
    aspect-ratio:16/9 !important;
  }

  /* ── 横条展览：满宽 + 21:9（比 16:9 更扁） ── */
  .grid{
    max-width:100% !important;
    margin:0 !important;
  }
  .grid figure{
    aspect-ratio:21/9 !important;
    border-radius:12px !important;
  }
  .grid .art{
    background-size:cover !important;
    background-position:center !important;
    border-radius:12px !important;
  }

  /* ── 最终覆盖：卡片宽度（高特异性压过前面所有重复规则） ── */
  body .grid{max-width:880px !important;margin:0 auto !important;}
  body .grid figure{width:100% !important;aspect-ratio:21/9 !important;}
  body .grid .art{inset:0 !important;background-size:cover !important;background-position:center !important;}

  /* ── 最终高度：把 21:9 的高度再切到 1/3（约 7:1） ── */
  body .grid figure{
    width:100% !important;
    aspect-ratio:7/1 !important;
    border-radius:10px !important;
  }
  body .grid .art{
    inset:0 !important;
    background-size:cover !important;
    background-position:center !important;
    border-radius:10px !important;
  }

  /* ── 占位符在扁条里按高度适配（不再撑破） ── */
  .ph{
    background-size:auto 78% !important;
    background-position:center !important;
    opacity:.5 !important;
    mix-blend-mode:normal !important;
  }
  /* 占位时卡片底色改深（避免大白块） */
  .grid figure{
    background:#22223A !important;
  }

  /* ── 卡片底恢复白（图片 multiply 需要白底才不失真） ── */
  .grid figure{background:#FFFFFF !important;}
  /* 占位符：不混合、按高度适配、居中 */
  .ph{
    background-size:auto 76% !important;
    background-position:center !important;
    opacity:.55 !important;
    mix-blend-mode:multiply !important;
  }

  /* ── 宽度满屏，高度仍按 7:1（自动变约 170px） ── */
  body .grid{
    max-width:100% !important;
    margin:0 !important;
  }
  body .grid figure{
    width:100% !important;
    aspect-ratio:7/1 !important;

<script>
(function(){
  function sync(){
    document.querySelectorAll('.side label').forEach(function(l){ l.classList.remove('on'); });
    document.querySelectorAll('input.g-radio:checked').forEach(function(r){
      var l = document.querySelector('.side label[for="' + r.id + '"]');
      if (l) l.classList.add('on');
    });
  }
  document.addEventListener('change', function(e){
    if (e.target && e.target.classList && e.target.classList.contains('g-radio')) sync();
  });
  sync();
})();
</script>
<script>
(function(){
  var mask = document.createElement('div');
  mask.className = 'lb-mask';
  mask.innerHTML = '<span class="lb-close">&times;</span><img alt="">';
  document.body.appendChild(mask);
  var imgEl = mask.querySelector('img');

  function open(url){
    imgEl.src = url;
    mask.classList.add('on');
  }
  function close(){ mask.classList.remove('on'); imgEl.src = ''; }

  mask.addEventListener('click', function(e){
    if (e.target === mask || e.target.className === 'lb-close') close();
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });

  document.querySelectorAll('.grid figure').forEach(function(fig){
    fig.addEventListener('click', function(){
      var art = fig.querySelector('.art');
      if (!art) return;
      var bg = art.style.backgroundImage || '';
      if (bg.indexOf('url(') === -1) return;
      var url = bg.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
      open(url);
    });
  });
})();
</script>
